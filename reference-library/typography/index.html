</style><h1>一句话，六种声音。</h1><p>字体先决定语气与字形，再决定排版及动画。以下是同一内容的六组静态选型样张；每片选择适合的一套系统继续发展，无需把所有方案都放进一支片。样张不证明动态阅读已经合格。</p><div class="grid">

<footer><h2>实际浏览器字体加载</h2><p>下面文字直接使用随项目保存的字体，关闭合成粗体。上面六张 PNG 使用同一批原始文件离线排版。圆体样张采用繁体字；粉圆不能默认覆盖简体文案。</p><div id="fixtures"></div><pre id="checks">检查中…</pre><p><a href="../../.agents/skills/motion-craft/references/typography-poster-pairings.md">研究与选型说明</a> · <a href="font-verification.json">字体版本和 SHA-256</a> · <a href="specimen-glyph-check.json">样张字形核查</a></p></footer>
<script>
const samples=[['TestSans',900,'让复杂 变清楚'],['TestSerif',800,'让复杂 变清楚'],['TestHuang',400,'让复杂 变清楚'],['TestHuninn',400,'讓複雜 變清楚'],['TestMa',400,'让复杂 变清楚'],['TestSmiley',400,'让复杂 变清楚'],['TestNunito',800,'Make it clear.'],['TestBarlow',700,'MAKE IT CLEAR 99.9%'],['TestBebas',400,'MAKE IT CLEAR']];
const host=document.querySelector('#fixtures'); for (const [family,weight,text] of samples){const p=document.createElement('p');p.className='fixture';p.style.fontFamily=family;p.style.fontWeight=weight;p.style.fontSynthesis='none';p.textContent=text+' '; const s=document.createElement('small');s.textContent=family+' / '+weight;p.append(s);host.append(p)}
(async()=>{window.fontReport=[];for(const [family,weight,text]of samples){try{const loaded=await document.fonts.load(`${weight} 40px ${family}`,text);window.fontReport.push({family,weight,loadedFaces:loaded.length,status:loaded.map(f=>f.status),check:document.fonts.check(`${weight} 40px ${family}`,text)});}catch(e){window.fontReport.push({family,error:String(e)})}}await document.fonts.ready;document.querySelector('#checks').textContent=JSON.stringify(window.fontReport,null,2)})();
</script></html>
