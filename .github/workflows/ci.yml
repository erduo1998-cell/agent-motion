name: Portable toolchain
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install-deps chromium
      - name: First-run setup and real CPU matting
        run: npm run onboard
        env:
          AGENT_MOTION_FORCE_MANAGED_MEDIA: '1'
      - run: npm test
      - run: npm run package:check
      - run: npm run smoke
